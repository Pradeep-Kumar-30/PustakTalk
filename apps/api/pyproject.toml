[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pustaktalk-api"
version = "0.1.0"
description = "PustakTalk's page-aware document intelligence API"
requires-python = ">=3.11,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "arq>=0.26,<1",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=0.2,<2",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.25,<2",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "pytesseract>=0.3,<1",
  "pillow>=11,<12",
  "python-multipart>=0.0.18,<1",
  "qdrant-client>=1.13,<2",
  "sqlalchemy>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
ai = [
  "faster-whisper>=1.1,<2",
  "piper-tts>=1.4,<2",
  "sentence-transformers>=3.3,<4",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
